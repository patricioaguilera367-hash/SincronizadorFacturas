name: tests

on:
  push:
    branches:
      - main
      - feature/portable-v1.2.0
  pull_request:

jobs:
  unittest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install runtime test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Flask>=3.1,<4" "PyMuPDF>=1.28,<2"

      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m py_compile servidor.py cache_runtime.py factura_montos.py cobros.py revision.py

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py"
